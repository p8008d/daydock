version: '3.8'

services:
  dashboard:
    build: .
    container_name: daydock-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_ACTIVITY_ENABLED=true
      - NUXT_ACTIVITY_DIR=/app/data/activity
    volumes:
      - activity-data:/app/data/activity
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  activity-data:
